<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Client Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .connected { background-color: #2e7d32; }
        .disconnected { background-color: #c62828; }
        #display-container {
            text-align: center;
            max-width: 80%;
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
        }
        #display-container.visible {
            opacity: 1;
        }
        h1 { font-size: 3rem; margin-bottom: 20px; }
        img {
            max-height: 50vh;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .waste-tag {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
        }
        .organic { background-color: #4caf50; color: white; }
        .plastic { background-color: #2196f3; color: white; }
        #placeholder {
            font-size: 2rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="status" class="disconnected">Disconnected</div>
    
    <div id="placeholder">Ready to scan...</div>

    <div id="display-container">
        <h1 id="item-name"></h1>
        <img id="item-image" src="" alt="Item Image">
        <div>
            <span id="item-tag" class="waste-tag"></span>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const container = document.getElementById('display-container');
        const placeholder = document.getElementById('placeholder');
        const itemName = document.getElementById('item-name');
        const itemImage = document.getElementById('item-image');
        const itemTag = document.getElementById('item-tag');

        function connect() {
            // Point to the local mock relay port
            const ws = new WebSocket('ws://localhost:8765');

            ws.onopen = () => {
                statusEl.textContent = 'Connected';
                statusEl.className = 'connected';
                console.log('Connected to mock relay');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);

                if (data.action === 'show_item') {
                    placeholder.style.display = 'none';
                    
                    itemName.textContent = data.item.name;
                    itemImage.src = data.item.image_url;
                    itemTag.textContent = data.item.waste_type;
                    
                    // Reset tag classes
                    itemTag.className = 'waste-tag ' + data.item.waste_type;
                    
                    container.classList.add('visible');
                } else if (data.action === 'clear') {
                    container.classList.remove('visible');
                    setTimeout(() => {
                        placeholder.style.display = 'block';
                    }, 500);
                }
            };

            ws.onclose = () => {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'disconnected';
                container.classList.remove('visible');
                placeholder.style.display = 'block';
                console.log('Disconnected. Retrying in 2 seconds...');
                setTimeout(connect, 2000);
            };
        }

        connect();
    </script>
</body>
</html>
